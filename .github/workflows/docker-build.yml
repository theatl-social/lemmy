name: Build Docker Images

on:
  push:
    branches: [ "forked-main", "v0.19.13-theatl", "20251202/beta-refactor", "merge/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "forked-main", "v0.19.13-theatl", "20251202/beta-refactor", "merge/*" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'forked-main'
        type: choice
        options:
          - forked-main
          - v0.19.13-theatl
          - 20251003/add-login-hook
          - 20251202/beta-refactor

# Keep both image publications from one run together on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  LEMMY_IMAGE_NAME: lemmy
  LEMMY_UI_IMAGE_NAME: lemmy-ui

jobs:
  build-lemmy:
    name: Build Lemmy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lemmy Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          tags: lemmy-smoke-backend:${{ github.run_id }}
          outputs: type=docker,dest=${{ runner.temp }}/backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          platforms: linux/amd64
          build-args: |
            RUST_RELEASE_MODE=release

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend.tar
          retention-days: 1
          compression-level: 0

  build-lemmy-ui:
    name: Build Lemmy UI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout lemmy-ui repository
        uses: actions/checkout@v4
        with:
          repository: LemmyNet/lemmy-ui
          ref: 7cb4cd8c20f3b2c37e9a0a9797aa9caddd79db58 # 0.19.21
          fetch-depth: 0
          path: lemmy-ui
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate matching UI release and regression checks
        run: |
          node --test scripts/ui/*.test.mjs
          node scripts/ui/validate-source.mjs lemmy-ui

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lemmy UI Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./lemmy-ui
          tags: lemmy-smoke-ui:${{ github.run_id }}
          outputs: type=docker,dest=${{ runner.temp }}/ui.tar
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max
          platforms: linux/amd64

      - uses: actions/upload-artifact@v4
        with:
          name: ui-image
          path: ${{ runner.temp }}/ui.tar
          retention-days: 1
          compression-level: 0

  smoke:
    name: Smoke backend and UI together
    needs: [build-lemmy, build-lemmy-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-image'
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load exact candidate images
        run: |
          docker load --input "$RUNNER_TEMP/images/backend.tar"
          docker load --input "$RUNNER_TEMP/images/ui.tar"
      - name: Verify real API, server-rendered UI and JavaScript assets
        env:
          LEMMY_SMOKE_BACKEND_IMAGE: lemmy-smoke-backend:${{ github.run_id }}
          LEMMY_SMOKE_UI_IMAGE: lemmy-smoke-ui:${{ github.run_id }}
        run: |
          LEMMY_SMOKE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          export LEMMY_SMOKE_VERSION
          bash scripts/ui/smoke-images.sh

  publish:
    name: Publish tested ${{ matrix.image }} image
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: lemmy
            artifact: backend
          - image: lemmy-ui
            artifact: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}-image
          path: ${{ runner.temp }}/images
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image that passed smoke without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          ARTIFACT: ${{ matrix.artifact }}
          CANDIDATE: lemmy-smoke-${{ matrix.artifact }}:${{ github.run_id }}
        run: |
          docker load --input "$RUNNER_TEMP/images/$ARTIFACT.tar"
          while IFS= read -r tag; do
            docker tag "$CANDIDATE" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
